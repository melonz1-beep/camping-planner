
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camping Planner & Packing List</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./mountain-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./mountain-icon-512.png">
<link rel="apple-touch-icon" href="./mountain-icon-192.png">
<meta name="theme-color" content="#2f5d44">

<style>
body{margin:0;font-family:Arial,sans-serif;background:#1f3b2d;color:white;}
header{background:#2f5d44;padding:20px;text-align:center;font-size:28px;font-weight:bold;}
.subtitle{font-size:16px;font-weight:normal;margin-top:8px;opacity:.9;}
.tabs{display:flex;overflow-x:auto;background:#274936;padding:10px;gap:10px;}
.tabs button{background:#f4c14a;border:none;padding:10px 16px;border-radius:12px;font-weight:bold;cursor:pointer;white-space:nowrap;}
.page{display:none;padding:16px;}
.page.active{display:block;}
.card{background:#355b45;border-radius:20px;padding:16px;margin-bottom:18px;box-shadow:0 4px 12px rgba(0,0,0,.35);}
.item{margin:10px 0;}
input[type="checkbox"]{transform:scale(1.3);margin-right:10px;}
input[type="text"]{width:68%;padding:10px;border:none;border-radius:10px;}
button.add{background:#f4c14a;border:none;padding:10px 14px;border-radius:10px;font-weight:bold;cursor:pointer;}
textarea{width:100%;min-height:200px;border:none;border-radius:14px;padding:12px;margin-top:10px;font-size:16px;}
.footer{text-align:center;padding:20px;opacity:.8;}
</style>
</head>

<body>

<header>
🏔️ Camping Planner
<div class="subtitle">Camping Planner & Packing List</div>
</header>

<div class="tabs">
<button onclick="showTab('suppliesTab')">📋 Supplies</button>
<button onclick="showTab('clothingTab')">👕 Clothing</button>
<button onclick="showTab('toiletriesTab')">🪥 Toiletries</button>
<button onclick="showTab('medicalTab')">💊 Medical</button>
<button onclick="showTab('menuTab')">🍽️ Menu</button>
<button onclick="showTab('shoppingTab')">🛒 Shopping</button>
<button onclick="showTab('notesTab')">📝 Notes</button>
</div>

<div id="suppliesTab" class="page active">
<div class="card"><h2>📋 Camping Supplies</h2><div id="supplies"></div>
<input type="text" id="supplyInput" placeholder="Add supply item">
<button class="add" onclick="addItem('supplies','supplyInput')">Add</button></div>
</div>

<div id="clothingTab" class="page">
<div class="card"><h2>👕 Clothing</h2><div id="clothing"></div>
<input type="text" id="clothingInput" placeholder="Add clothing item">
<button class="add" onclick="addItem('clothing','clothingInput')">Add</button></div>
</div>

<div id="toiletriesTab" class="page">
<div class="card"><h2>🪥 Toiletries</h2><div id="toiletries"></div>
<input type="text" id="toiletryInput" placeholder="Add toiletry item">
<button class="add" onclick="addItem('toiletries','toiletryInput')">Add</button></div>
</div>

<div id="medicalTab" class="page">
<div class="card"><h2>💊 Medical Kit & Medicines</h2><div id="medical"></div>
<input type="text" id="medicalInput" placeholder="Add medical item">
<button class="add" onclick="addItem('medical','medicalInput')">Add</button></div>
</div>

<div id="menuTab" class="page">
<div class="card"><h2>🍽️ Camping Menu Planner</h2>
<h3>Day 1</h3><textarea placeholder="Breakfast, lunch, dinner, snacks..."></textarea>
<h3>Day 2</h3><textarea placeholder="Breakfast, lunch, dinner, snacks..."></textarea>
<h3>Day 3</h3><textarea placeholder="Breakfast, lunch, dinner, snacks..."></textarea></div>
</div>

<div id="shoppingTab" class="page">
<div class="card"><h2>🛒 Food Shopping List</h2><div id="shopping"></div>
<input type="text" id="shoppingInput" placeholder="Add grocery item">
<button class="add" onclick="addItem('shopping','shoppingInput')">Add</button></div>
</div>

<div id="notesTab" class="page">
<div class="card"><h2>📝 Notes</h2>
<textarea placeholder="Trip reminders, campsite info, reservations, packing notes..."></textarea></div>
</div>

<div class="footer">Mountain Edition Camping Planner</div>

<script>
const starterItems = {
supplies:["Tent","Lantern","Sleeping Bags","Camp Chairs"],
clothing:["Hoodie","Rain Jacket","Extra Socks"],
toiletries:["Toothbrush","Soap","Wet Wipes"],
medical:["Bandages","Pain Reliever","Prescription Medications"],
shopping:["Hot Dogs","Eggs","Coffee","Ice"]
};

function showTab(tabId){
 document.querySelectorAll('.page').forEach(page=>page.classList.remove('active'));
 document.getElementById(tabId).classList.add('active');
}

function createCheckbox(containerId,text){
 const div=document.createElement("div");
 div.className="item";
 const checkbox=document.createElement("input");
 checkbox.type="checkbox";
 const label=document.createElement("label");
 label.textContent=text;
 div.appendChild(checkbox);
 div.appendChild(label);
 document.getElementById(containerId).appendChild(div);
}

function addItem(section,inputId){
 const input=document.getElementById(inputId);
 if(input.value.trim()!==""){
   createCheckbox(section,input.value);
   input.value="";
 }
}

for (const section in starterItems){
 starterItems[section].forEach(item=>createCheckbox(section,item));
}
</script>

</body>
</html>
